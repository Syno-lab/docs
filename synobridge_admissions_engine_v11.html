<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synobridge Admissions Engine V11</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{font-family:Inter,system-ui,sans-serif}input[type=range]{accent-color:#4f46e5}.mono{font-family:ui-monospace,monospace}</style>
</head>
<body class="bg-slate-50 text-slate-800">
<header class="sticky top-0 z-20 bg-slate-950 text-white shadow-xl"><div class="max-w-7xl mx-auto p-4 flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-500 to-sky-400 flex items-center justify-center font-black text-xl">S</div><div><h1 class="font-black text-xl">SYNOBRIDGE <span class="text-indigo-300 text-xs mono">V11 AE</span></h1><p class="text-[11px] text-slate-400">多體系名校競爭力評估，不是錄取機率預測</p></div></div></header>
<main class="max-w-7xl mx-auto p-4 grid lg:grid-cols-12 gap-5">
<section class="lg:col-span-5 space-y-4">
<div id="warnings" class="hidden p-4 rounded-2xl bg-amber-50 border-2 border-amber-200 text-xs"></div>
<div class="bg-white p-5 rounded-2xl border shadow-sm"><h2 class="font-black text-sm border-b pb-3 mb-4">1. 申請類型</h2><div class="grid grid-cols-2 gap-2 mb-3"><button data-degree="undergrad" class="degree p-2 rounded-lg bg-indigo-100 text-indigo-800 font-bold text-xs">本科</button><button data-degree="master" class="degree p-2 rounded-lg text-xs font-bold">研究生</button></div><div id="ugType" class="grid grid-cols-2 gap-2 mb-3"><button data-app="freshman" class="app p-2 rounded-lg bg-indigo-100 text-indigo-800 font-bold text-xs">新生</button><button data-app="transfer" class="app p-2 rounded-lg text-xs font-bold">轉學</button></div><label class="text-xs font-bold">申請人身份<select id="residency" class="w-full mt-1 p-2 border rounded-lg text-xs"><option value="intl">國際生</option><option value="CA">加州居民</option><option value="VA">維吉尼亞居民</option><option value="NC">北卡居民</option><option value="other_us">美國其他州</option></select></label></div>
<div class="bg-white p-5 rounded-2xl border shadow-sm"><h2 class="font-black text-sm border-b pb-3 mb-4">2. 學業與語言</h2><label class="text-xs font-bold">課程體系<select id="curriculum" class="w-full mt-1 p-2 border rounded-lg text-xs"></select></label><div id="academicFields" class="mt-4"></div><div class="mt-4 p-3 bg-sky-50 rounded-xl border border-sky-200"><label class="text-xs font-bold">語言考試<select id="langType" class="w-full mt-1 p-2 border rounded-lg text-xs"><option value="toefl">TOEFL iBT 舊制 0-120</option><option value="toefl_new">TOEFL 新制 1-6</option><option value="ielts">IELTS Academic</option><option value="det">Duolingo English Test</option><option value="waiver">英語授課背景，可申請豁免</option></select></label><input id="langScore" class="w-full mt-3" type="range" min="60" max="120" value="105"><div class="flex justify-between text-xs"><span>成績</span><b id="langValue">105</b></div><p class="text-[10px] text-slate-500 mt-2">語言不足通常是風險提示，不會在所有學校直接判拒。</p></div></div>
<div class="bg-white p-5 rounded-2xl border shadow-sm"><h2 class="font-black text-sm border-b pb-3 mb-4">3. 專業與申請材料</h2><label class="text-xs font-bold">申請專業<select id="major" class="w-full mt-1 p-2 border rounded-lg text-xs"></select></label><div id="usExtras" class="mt-4"></div><div class="mt-4"><label class="text-xs font-bold">文書品質 <b id="essayV" class="float-right">7</b></label><input id="essay" type="range" min="1" max="10" step="0.5" value="7" class="w-full"></div><div class="mt-3"><label class="text-xs font-bold">推薦信 <b id="recV" class="float-right">7</b></label><input id="rec" type="range" min="1" max="10" step="0.5" value="7" class="w-full"></div><div class="mt-3"><label class="text-xs font-bold">科研/競賽 <b id="researchV" class="float-right">6</b></label><input id="research" type="range" min="1" max="10" value="6" class="w-full"></div><div class="mt-3"><label class="text-xs font-bold">活動與影響力 <b id="activityV" class="float-right">7</b></label><input id="activity" type="range" min="1" max="10" value="7" class="w-full"></div></div>
<div class="bg-white p-5 rounded-2xl border shadow-sm"><h2 class="font-black text-sm border-b pb-3 mb-4 flex justify-between">4. 目標院校 <span id="target-count" class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-1 rounded-full">3 所</span></h2><select id="school" class="w-full p-2 border rounded-lg text-xs"></select><div id="selected" class="flex flex-wrap gap-2 mt-3"></div><button id="run" class="w-full mt-4 p-3 rounded-xl bg-indigo-600 text-white font-black text-sm">開始評估</button></div>
</section>
<section class="lg:col-span-7"><div id="empty" class="min-h-[500px] bg-white border-2 border-dashed rounded-3xl flex items-center justify-center text-center p-8"><div><i data-lucide="compass" class="w-12 h-12 text-indigo-300 mx-auto mb-3"></i><h2 class="font-bold">等待評估</h2><p class="text-xs text-slate-400 mt-2">先選擇至少一所院校，再開始評估。</p></div></div><div id="results" class="hidden space-y-4"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);const state={degree:'undergrad',app:'freshman',curr:'us_ap',selected:['harvard','ucla','cambridge']};
const PCT_PTS=[[60,10],[75,45],[80,60],[85,74],[88,82],[90,88],[95,98],[100,100]], GPA_PTS=[[2,10],[3,40],[3.3,55],[3.5,66],[3.7,77],[3.8,83],[3.9,89],[4,95]], IB_PTS=[[24,20],[30,45],[34,64],[36,72],[38,80],[40,87],[42,93],[45,100]], DSE_PTS=[[15,15],[20,48],[24,65],[27,76],[30,88],[35,100]], GSAT_PTS=[[30,15],[40,40],[44,52],[48,64],[52,78],[56,90],[60,100]], SAT_PTS=[[800,0],[1200,38],[1300,52],[1400,68],[1450,77],[1500,85],[1550,93],[1600,100]];
const CTX=[['rural','偏鄉/農村'],['low_inc','低收入家庭'],['first_gen','第一代大學生'],['limited','缺少進階課程/資源']];let charts={};
const interp=(x,p)=>{if(x<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++){if(x<=p[i][0]){let [x0,y0]=p[i-1],[x1,y1]=p[i];return y0+(x-x0)/(x1-x0)*(y1-y0)}}return p[p.length-1][1]};
const selSchools=()=>state.selected.map(id=>schools.find(s=>s.id===id)).filter(Boolean);const isFresh=()=>state.degree==='undergrad'&&state.app==='freshman';const isTransfer=()=>state.degree==='undergrad'&&state.app==='transfer';
const majors={cs:['計算機科學',-10],engineering:['工程',-7],math:['數學',-5],biology:['生物/醫學',-4],economics:['經濟學',-7],business:['商科/金融',-8],humanities:['人文學科',2],undecided:['未決定',0]};
const schools=[
['harvard','哈佛大學','us','holistic',90,'required','REA'],['yale','耶魯大學','us','holistic',90,'flexible','SCEA'],['princeton','普林斯頓大學','us','holistic',90,'optional','SCEA'],['columbia','哥倫比亞大學','us','holistic',88,'optional','ED'],['upenn','賓夕法尼亞大學','us','holistic',88,'optional','ED'],['brown','布朗大學','us','holistic',88,'required','ED'],['dartmouth','達特茅斯學院','us','holistic',87,'required','ED'],['cornell','康奈爾大學','us','holistic',85,'required','ED'],['mit','麻省理工學院','us','holistic',92,'required','EA'],['stanford','史丹佛大學','us','holistic',90,'required','REA'],['caltech','加州理工學院','us','holistic',93,'required','REA'],['duke','杜克大學','us','holistic',86,'required','ED'],['jhu','約翰霍普金斯大學','us','holistic',86,'required','ED'],['northwestern','西北大學','us','holistic',85,'optional','ED'],['uchicago','芝加哥大學','us','holistic',86,'optional','ED'],['vanderbilt','范德堡大學','us','holistic',85,'required','ED'],['ucla','UCLA','us','uc',85,'blind',''],['ucb','UC Berkeley','us','uc',86,'blind',''],['ucsd','UC San Diego','us','uc',82,'blind',''],['michigan','密西根大學安娜堡','us','holistic',82,'optional','EA'],['uva','維吉尼亞大學','us','holistic',82,'optional','ED'],['unc','北卡教堂山','us','holistic',80,'required','EA'],['cambridge','劍橋大學','uk','uk',92,'course',''],['oxford','牛津大學','uk','uk',90,'course',''],['imperial','帝國理工學院','uk','uk',90,'course',''],['lse','倫敦政經學院','uk','uk',85,'course',''],['ucl','倫敦大學學院','uk','uk',80,'course',''],['hku','香港大學','hk','cutoff',80,'gaokao',''],['cuhk','香港中文大學','hk','cutoff',78,'gaokao',''],['hkust','香港科技大學','hk','cutoff',78,'gaokao',''],['nus','新加坡國立大學','sg','cutoff',85,'gaokao',''],['ntu','南洋理工大學','sg','cutoff',80,'gaokao',''],['uoft','多倫多大學','ca','cutoff',80,'course',''],['mcgill','麥吉爾大學','ca','cutoff',80,'course',''],['ubc','英屬哥倫比亞大學','ca','cutoff',78,'course',''],['unimelb','墨爾本大學','au','cutoff',75,'course',''],['columbia32','哥大 3+2 工程','us','dual',65,'gpa',''],['dartmouth32','達特茅斯 3+2','us','dual',68,'gpa',''],['caltech32','加州理工 3/2','us','dual',70,'gpa','']].map(x=>({id:x[0],name:x[1],region:x[2],sys:x[3],thr:x[4],test:x[5],early:x[6]}));
const currOptions={freshman:[['us_ap','美國 AP/SAT'],['ib','IB DP'],['uk_alevel','A-Level'],['cn_gaokao','中國大陸高考'],['hk_dse','香港 DSE'],['tw_gsat','臺灣學測']],transfer:[['cc','美國社區學院'],['cn_transfer','中國本科轉學'],['hk_transfer','香港副學士'],['tw_transfer','臺灣技專校院']],master:[['cn_c9','中國 C9/985'],['cn_211','中國 211'],['cn_other','中國其他本科'],['uk_degree','英國本科'],['us_degree','美國本科'],['au_degree','澳洲本科'],['ca_degree','加拿大本科']]};
function options(el,arr){el.innerHTML=arr.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}
function renderSchools(){options($('school'),schools.map(s=>[s.id,s.name]));$('selected').innerHTML=state.selected.map(id=>{let s=schools.find(x=>x.id===id);return `<span class="px-2 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-[10px] font-bold">${s.name} <button onclick="removeSchool('${id}')">×</button></span>`}).join('')}
function renderCurr(){options($('curriculum'),currOptions[state.degree==='master'?'master':state.app]);$('curriculum').value=state.curr;$('curriculum').onchange=e=>{state.curr=e.target.value;renderAcademic()}}
function renderMajor(){options($('major'),Object.entries(majors).map(x=>[x[0],x[1][0]]));$('major').value='cs'}
function renderAcademic(){let c=state.curr;let h='';if(c==='us_ap')h=`<label class="text-xs font-bold">高中 GPA <b id="gpaV" class="float-right">3.85</b></label><input id="gpa" type="range" min="2" max="4" step=".01" value="3.85" class="w-full">${sliderHtml('AP 5 分門數','ap5',0,12,5)}`;else if(c==='ib')h=`${sliderHtml('IB 總分','ib',24,45,39)}${sliderHtml('HL 7 分數','ib7',0,3,2)}<label class="text-xs"><input id="ibMath" type="checkbox" checked> Math AA HL</label>`;else if(c==='uk_alevel')h=`${sliderHtml('A-Level 等效分','al',60,100,95)}<label class="text-xs"><input id="fm" type="checkbox" checked> Further Maths（僅相關專業使用）</label>`;else if(c==='cn_gaokao')h=`${sliderHtml('高考預估分','gaokao',400,750,635)}${sliderHtml('高中平時均分','cnavg',60,100,92)}${sliderHtml('全省排名百分比','gkPct',.05,40,1)}<label class="text-xs block mt-2"><input id="gkResult" type="checkbox"> 已有高考實際成績</label><label class="text-xs block mt-2"><input id="ast" type="checkbox"> 已有達標 AST（LSE）</label>`;else if(c==='hk_dse')h=`${sliderHtml('DSE Best 5','dse',15,35,27)}${sliderHtml('DSE 英文等級（近似）','dseEng',1,8,7)}<label class="text-xs"><input id="dse3322" type="checkbox" checked> 具備 3322 基本資格</label>`;else if(c==='tw_gsat')h=sliderHtml('學測四科總級分','gsat',30,60,52);else if(state.degree==='master')h=sliderHtml('本科均分/等效分','masterPct',60,100,85);else h=sliderHtml('目前院校 GPA/均分','transferScore',60,100,85);h+=`<div class="mt-4 p-3 bg-slate-50 rounded-xl border"><label class="text-xs font-bold">SAT/ACT 狀態</label><select id="satStatus" class="w-full mt-1 p-2 border rounded-lg text-xs"><option value="not_applicable">不適用/非美國課程</option><option value="have">已有 SAT/ACT 成績</option><option value="can_test">尚可安排考試</option><option value="cannot_test">中國大陸普高目前無法參加 SAT/ACT</option></select><div id="testBox" class="mt-2">${sliderHtml('SAT 分數','sat',800,1600,1510)}</div><p class="text-[10px] text-slate-500 mt-2">中國大陸普高預設使用「無法參加」。模型不會因此對所有美國院校直接判拒，會依逐校替代政策給予提示。</p></div>`;$('academicFields').innerHTML=h;bindInputs();updateAcademicVisibility()}
function sliderHtml(label,id,min,max,val){return `<div class="mt-3"><label class="text-xs font-bold">${label} <b id="${id}V" class="float-right">${val}</b></label><input id="${id}" type="range" min="${min}" max="${max}" step="${id==='gkPct'?'.05':id==='sat'?10:1}" value="${val}" class="w-full"></div>`}
function bindInputs(){document.querySelectorAll('#academicFields input[type=range]').forEach(e=>e.oninput=()=>{let v=e.value;let o=$(e.id+'V');if(o)o.textContent=v;if(e.id==='gpa')$('gpaV').textContent=Number(v).toFixed(2)});$('satStatus')?.addEventListener('change',updateAcademicVisibility)}
function updateAcademicVisibility(){let st=$('satStatus')?.value;if($('testBox'))$('testBox').classList.toggle('hidden',st!=='have');}
function buildExtras(){let s=selSchools(),hasUS=s.some(x=>x.region==='us'),hasUK=s.some(x=>x.region==='uk');let h='';if(hasUS&&isFresh())h+=`<label class="text-xs font-bold">美國申請輪次<select id="early" class="w-full mt-1 p-2 border rounded-lg text-xs"><option value="none">RD/常規</option><option value="ED">ED</option><option value="EA">EA</option><option value="REA">REA/SCEA</option></select></label><label class="flex gap-2 text-xs mt-3"><input id="needAid" type="checkbox"> 需要大學助學金</label>`;if(hasUK&&isFresh())h+=`<div class="mt-3">${sliderHtml('入學考試百分位','ukTest',0,100,60)}${sliderHtml('面試/學術討論表現','ukInterview',1,10,6)}${sliderHtml('Super-curricular 深度','superCur',1,10,6)}<p class="note mt-2">英國筆試需按專業對應 ESAT、TMUA、MAT、PAT、TSA、UCAT 等；此處是概略輸入，不代表正式分數。</p></div>`;if(s.some(x=>x.region==='sg'))h+=`<label class="flex gap-2 text-xs mt-3"><input id="aba" type="checkbox"> 願意提交 ABA 面試/能力導向材料</label><p class="note">新加坡學費補助可能附帶畢業後工作服務協議，請另行確認。</p>`;if(isTransfer())h+=`<label class="flex gap-2 text-xs mt-3"><input id="majorPrep" type="checkbox" checked> 已完成 Major Prep</label><select id="contract" class="w-full mt-2 p-2 border rounded text-xs"><option value="none">無轉學協議</option><option value="tag">TAG（僅適用指定 UC 分校）</option><option value="adt">ADT（主要對 CSU）</option></select>`;if(state.degree==='master')h+=`<label class="text-xs font-bold block mt-3">研究生路徑<select id="pgPath" class="w-full mt-1 p-2 border rounded text-xs"><option value="taught">授課型碩士</option><option value="phd">博士/研究型</option></select></label>${state.pgType==='phd'?sliderHtml('導師匹配度','faculty',1,10,6):sliderHtml('論文/科研深度','paper',0,10,3)}`;$('usExtras').innerHTML=h;document.querySelectorAll('#usExtras input[type=range]').forEach(e=>e.oninput=()=>{let o=$(e.id+'V');if(o)o.textContent=e.value})}
function bindQual(){['essay','rec','research','activity'].forEach(k=>{let e=$(k);e.oninput=()=>$(k+'V').textContent=e.value});$('essay').oninput=()=>{$('essayV').textContent=$('essay').value};$('rec').oninput=()=>{$('recV').textContent=$('rec').value};$('research').oninput=()=>{$('researchV').textContent=$('research').value};$('activity').oninput=()=>{$('activityV').textContent=$('activity').value}}
function setDegree(d){state.degree=d;state.app=d==='undergrad'?'freshman':'master';$('ugType').classList.toggle('hidden',d!=='undergrad');renderCurr();renderAcademic();buildExtras();}
function setApp(a){state.app=a;renderCurr();renderAcademic();buildExtras()}
function addSchool(id){if(!id)return;if(!state.selected.includes(id)){if(state.selected.length<8)state.selected.push(id);else toast('最多選擇 8 所院校')}renderSchools();buildExtras();$('school').value=''}
function removeSchool(id){state.selected=state.selected.filter(x=>x!==id);renderSchools();buildExtras()}
function renderSchools(){renderSchoolsSelect();$('target-count').textContent=state.selected.length+' 所'}
function renderSchoolsSelect(){options($('school'),schools.map(s=>[s.id,s.name]));$('selected').innerHTML=state.selected.map(id=>{let s=schools.find(x=>x.id===id);return `<span class="px-2 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-[10px] font-bold">${s.name} <button onclick="removeSchool('${id}')">×</button></span>`}).join('')}
function options(el,a){el.innerHTML=a.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}
function mobileTab(t){$('col-input').classList.toggle('hidden',t==='result');$('col-result').classList.toggle('hidden',t==='input');$('tab-input').className=t==='input'?'flex-1 py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white':'flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-400';$('tab-result').className=t==='result'?'flex-1 py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white':'flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-400'}
function buildContext(){ $('ctx-chips').innerHTML=CTX.map(x=>`<button data-c="${x[0]}" class="px-2 py-1 rounded border text-[10px]">${x[1]}</button>`).join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{b.classList.toggle('bg-amber-500');b.classList.toggle('text-white');b.classList.toggle('border-amber-500')})}
function setUp(){options($('major'),Object.entries(majors).map(x=>[x[0],x[1][0]]));renderSchoolsSelect();renderCurr();renderAcademic();buildExtras();buildContext();bindQual();$('run').onclick=runEngine;document.querySelectorAll('.degree').forEach(b=>b.onclick=()=>setDegree(b.dataset.degree));document.querySelectorAll('.app').forEach(b=>b.onclick=()=>setApp(b.dataset.app));$('school').onchange=e=>addSchool(e.target.value);$('curriculum').onchange=e=>{state.curr=e.target.value;renderAcademic();buildExtras()};lucide.createIcons()}
/* =========================================================
   5. 評估邏輯
   ========================================================= */
function scoreAcademic(s){let c=state.curr,v=0;if(c==='us_ap')v=interp(+($('#gpa')?.value||3.85),GPA_PTS)+Math.min(+$('ap5')?.value*1.5||0,10);else if(c==='ib')v=interp(+$('ib')?.value||39,IB_PTS);else if(c==='uk_alevel')v=+$('al')?.value||95;else if(c==='cn_gaokao')v=interp(+$('cnavg')?.value||92,PCT_PTS);else if(c==='hk_dse')v=interp(+$('dse')?.value||27,DSE_PTS);else if(c==='tw_gsat')v=interp(+$('gsat')?.value||52,GSAT_PTS);else if(state.degree==='master')v=interp(+$('masterPct')?.value||85,PCT_PTS);else v=interp(+$('transferScore')?.value||85,PCT_PTS);return clamp(v,0,100)}
function gkEligibility(s){let c=state.curr;if(c!=='cn_gaokao')return {ok:true,notes:[]};let notes=[];if(s.gk==='no')return {ok:false,reason:'該校本科不接受中國大陸高考直接申請'};if(s.gk==='top01'&&+$('gkPct')?.value>.1)return {ok:false,reason:'劍橋高考路徑典型要求為全省前 0.1%'};if(s.gk==='ast'&&!$('ast')?.checked)return {ok:false,reason:'LSE 高考路徑需要達標 AST 成績'};if(s.gk==='verify')notes.push('該校是否接受高考直申需核對當年官方頁面');if(s.sys==='holistic'){let sat=$('satStatus')?.value;if(sat==='cannot_test')notes.push('中國大陸普高無 SAT/ACT：本模型以高中均分為主，替代考試政策需向該校確認');}return {ok:true,notes}}
function evaluate(s){let notes=[],risks=[],reasons=[],a=scoreAcademic(s),soft=(+$('research').value*3)+(+$('activity').value*3)+6*2,qual=(+$('essay').value*4)+($('rec').value*3)+7*1.5+7*1.5,major=majors[$('major').value];let gk=gkEligibility(s);if(!gk.ok)return {s,zero:true,score:0,label:'Ineligible',reasons:[gk.reason],notes:[],stage:'資格過濾'};notes.push(...gk.notes);let satStatus=$('satStatus')?.value;let sat=+$('sat')?.value||0;if(s.sys==='holistic'&&isFresh()){if(s.test==='required'){if(state.curr==='cn_gaokao'&&satStatus==='cannot_test'){if(s.alt===false)risks.push('該校一般要求 SAT/ACT，需確認替代成績');else if(s.alt==='verify')notes.push('SAT/ACT 無法參加時的替代材料需核實');else notes.push('可考慮 AP/IB/A-Level/高考等替代材料，需核實具體要求')}else if(satStatus==='have')a=a*.6+interp(sat,SAT_PTS)*.4;else if(satStatus==='can_test')risks.push('該校要求標化，建議安排 SAT/ACT 或核實替代方案');}else if(s.test==='flexible'){if(satStatus==='have')a=a*.65+interp(sat,SAT_PTS)*.35;else notes.push('可用 SAT/ACT、AP 或 IB 等校方接受的測試組合')}else if(s.test==='optional'&&satStatus==='have')a=a*.7+interp(sat,SAT_PTS)*.3;}if($('early')?.value==='ED')a+=4;if($('needAid')?.checked&&s.nb===false)risks.push('Need-aware：國際生申請資助可能增加不確定性');}if(s.sys==='uc'){notes.push('UC 不看 SAT/ACT；此項不參與計算');if(state.residency!=='CA')risks.push('州外/國際生與州內錄取池不同');if(isTransfer()&&['ucla','ucb','ucsd'].includes(s.id)&&$('contract')?.value==='tag')risks.push('TAG 不適用於 UCLA、UC Berkeley、UC San Diego')}if(s.sys==='uk'){let test=+$('ukTest')?.value||60,iv=+$('ukInterview')?.value||6,superc=+$('superCur')?.value||6;if(state.curr==='uk_alevel'&&['math','cs','engineering'].includes($('major').value)&&!$('fm')?.checked)risks.push('該理工專業通常強烈建議 Further Maths');if(test<50)risks.push('入學考試百分位偏低');if(s.iv==='none')notes.push('該院校/專業通常不採用常規面試');if(s.iv==='some')notes.push('只有部分專業設面試');a=a*.55+test*.25+iv*10*.1+superc*10*.1;if(state.curr==='cn_gaokao'&&s.id==='lse'&&state.hasAst)a+=8;}if(s.sys==='cutoff'){if(state.curr==='cn_gaokao'&&s.gk==='direct')notes.push('以省內位次、超出本科線分差、英語單科和專業要求為主');if(state.curr==='hk_dse')notes.push('DSE 應按 JUPAS 專業計分和往年分數線核對');if(s.reg==='sg'&&$('aba')?.checked) a+=5;if(s.id==='unimelb'&&state.curr==='cn_gaokao')return {s,zero:true,score:0,label:'Ineligible',reasons:['內地普高通常需要預科或指定高中直錄資格'],notes:['需核對墨大當年中國區資格頁面'],stage:'資格過濾'};}if(s.sys==='dual'&&isFresh())return {s,zero:true,score:0,label:'Ineligible',reasons:['3+2 是本科就讀期間的合作轉入路徑，不是高中畢業直接錄取'],notes:[],stage:'資格過濾'};if(state.degree==='master'&&$('pgPath')?.value==='phd'){notes.push('博士評估應額外核對導師匹配、科研方向和經費');a=a*.55+(+$('faculty')?.value||6)*4.5}else if(state.degree==='master')a=a*.8+qual*.2;let essayTheme=$('essayTheme')?.value;if(essayTheme==='savior')qual-=6;if(essayTheme==='niche'||essayTheme==='passion')qual+=5;let idx;if(s.sys==='holistic')idx=a*.45+soft*.25+qual*.3;else if(s.sys==='uc')idx=a*.7+soft*.18+qual*.12;else if(s.sys==='uk')idx=a*.75+qual*.15+soft*.1;else idx=a*.85+soft*.1+qual*.05;idx+=major.pen*.25;let score=Math.round(clamp(idx,0,99));let label=score>=82?'Strong':score>=70?'Target':score>=55?'Reach':'Unlikely';if(parseFloat(s.rate)<10&&label==='Strong')label='Reach';if(s.sys==='uk'&&score<55)return {s,zero:true,score:0,label:'Ineligible',reasons:['預估成績/筆試/材料低於該專業競爭區間'],notes,stage:'學術篩選'};let stages=s.sys==='holistic'?[{title:'地區初審',n:3,p:score>=70?.68:.3},{title:'全體委員會',n:5,p:score>=78?.62:.35}]:[];return {s,score,label,risks,reasons,notes,a:Math.round(a),soft:Math.round(soft),qual:Math.round(qual),stages,adv:Math.round(clamp(+$('activity').value*4+$('essay').value*4,10,95))}}
function vote(r){if(!r.stages.length)return'';let gen=r.s.id+'|'+r.score+'|'+Date.now().toString().slice(0,8),random=rng(gen),html='<div class="mt-3 p-3 bg-slate-50 rounded-xl border"><div class="font-bold text-xs mb-2">委員會示意投票，非學校真實流程</div>';let passAll=true;r.stages.forEach(st=>{let yes=0;for(let i=0;i<st.n;i++)if(random()<Math.min(.92,st.p+r.adv/300))yes++;let pass=yes>=Math.ceil(st.n/2);if(!pass)passAll=false;html+=`<div class="flex justify-between text-[10px] ${pass?'text-emerald-700':'text-rose-700'}"><span>${st.title}</span><b>${yes}/${st.n} ${pass?'通過':'未通過'}</b></div>`});return html+`<p class="text-[10px] mt-2 font-bold">${passAll?'示意：通過全部階段':'示意：在某一階段未通過'}</p></div>`}
function render(){let rs=state.selected.map(id=>evaluate(schools.find(s=>s.id===id)));$('empty').classList.add('hidden');$('results').classList.remove('hidden');$('cards').innerHTML=rs.map(r=>{let s=r.s,cls=r.zero?'border-rose-200 bg-rose-50/40':r.score>=80?'border-emerald-200':'border-slate-200';return `<div class="p-5 rounded-2xl border-2 ${cls}"><div class="flex justify-between gap-3"><div><h3 class="font-black text-lg">${s.name}</h3><p class="text-xs text-slate-600 mt-1">${r.zero?r.reasons.join('；'):`競爭力指數 ${r.score}，${r.label==='Strong'?'優勢':r.label==='Target'?'匹配':r.label==='Reach'?'衝刺':'難度大'}`}</p></div><div class="text-right"><b class="text-3xl mono ${r.zero?'text-rose-500':r.score>=80?'text-emerald-500':'text-indigo-600'}">${r.zero?'0':r.score}</b><div class="text-[10px] font-bold">${r.label}</div></div></div>${r.notes?.length?`<div class="mt-3 space-y-1">${r.notes.map(n=>`<p class="note">ⓘ ${n}</p>`).join('')}</div>`:''}${!r.zero?`<div class="grid grid-cols-3 gap-2 mt-4 text-[10px]"><span class="p-2 bg-sky-50 rounded">學術 ${r.a}</span><span class="p-2 bg-purple-50 rounded">軟實力 ${r.soft}</span><span class="p-2 bg-rose-50 rounded">材料 ${r.qual}</span></div>${r.risks?.length?`<div class="mt-3 flex flex-wrap gap-1">${r.risks.map(x=>`<span class="text-[10px] px-2 py-1 rounded-full bg-amber-50 text-amber-700">${x}</span>`).join('')}</div>`:''}${vote(r)}`:''}</div>`}).join('');$('warnings').classList.toggle('hidden',true);lucide.createIcons();draw(rs)}
function draw(rs){if(charts.r)charts.r.destroy();if(charts.p)charts.p.destroy();let avg=rs.filter(x=>!x.zero);let a=avg.length?avg.reduce((n,x)=>n+x.a,0)/avg.length:0;charts.r=new Chart($('radar'),{type:'radar',data:{labels:['學術','科研競賽','不可替代性','活動','文書'],datasets:[{data:[a,+$('research').value*10,+$('activity').value*8,+$('activity').value*10,+$('essay').value*10],backgroundColor:'rgba(79,70,229,.25)',borderColor:'#4f46e5'}]},options:{scales:{r:{min:0,max:100}},plugins:{legend:{display:false}}}});let s=schools.find(x=>x.id===state.selected[0]);let w=s.sys==='uk'?{a:75,s:10,q:15}:s.sys==='uc'?{a:70,s:18,q:12}:{a:45,s:25,q:30};charts.p=new Chart($('pie'),{type:'doughnut',data:{labels:['學術','軟實力/考試','質性材料'],datasets:[{data:[w.a,w.s,w.q],backgroundColor:['#0ea5e9','#a855f7','#f43f5e']}]},options:{plugins:{legend:{position:'bottom'}}}})}
function runEngine(){let warns=[];if(state.curr==='cn_gaokao'&&$('satStatus')?.value==='cannot_test')warns.push('中國大陸普高未開設 SAT/ACT：本模型不直接判拒，請核對替代成績政策。');if(state.curr==='cn_gaokao'&&+$('gkPct')?.value<=.1)warns.push('高考省前 0.1%：符合劍橋典型資格參考。');if(isTransfer()&&$('contract')?.value==='tag'&&state.selected.some(x=>['ucla','ucb','ucsd'].includes(x)))warns.push('TAG 不適用於 UCLA、UC Berkeley、UC San Diego。');render();mobileTab('result')}
function setDegree(d){state.degree=d;state.app=d==='master'?'master':'freshman';$('ugType').classList.toggle('hidden',d==='master');renderCurr();renderAcademic();buildExtras()}function setApp(a){state.app=a;state.degree='undergrad';renderCurr();renderAcademic();buildExtras()}function renderCurr(){options($('curriculum'),currOptions[state.degree==='master'?'master':state.app]);state.curr=$('curriculum').value;}
function buildExtras(){let h='';let ss=selSchools();if(ss.some(x=>x.sys==='holistic')&&isFresh())h+='<label class="text-xs font-bold">美國申請輪次<select id="early" class="w-full mt-1 p-2 border rounded-lg text-xs"><option value="none">RD/常規</option><option value="ED">ED</option><option value="EA">EA</option><option value="REA">REA/SCEA</option></select></label><label class="flex gap-2 text-xs mt-3"><input id="needAid" type="checkbox"> 需要大學助學金</label>';if(ss.some(x=>x.sys==='uk')&&isFresh())h+=sliderHtml('入學筆試百分位','ukTest',0,100,60)+sliderHtml('面試表現','ukInterview',1,10,6)+sliderHtml('Super-curricular','superCur',1,10,6);if(ss.some(x=>x.region==='sg'))h+='<label class="flex gap-2 text-xs mt-3"><input id="aba" type="checkbox"> 願意提交 ABA 材料</label>';if(isTransfer())h+='<label class="text-xs block mt-3"><input id="majorPrep" type="checkbox" checked> 已完成 Major Prep</label><select id="contract" class="w-full mt-2 p-2 border rounded text-xs"><option value="none">無轉學協議</option><option value="tag">TAG（指定 UC 分校）</option><option value="adt">ADT（主要對 CSU）</option></select>';if(state.degree==='master')h+=sliderHtml('本科均分','masterPct',60,100,85)+sliderHtml('導師/研究方向匹配','faculty',1,10,6)+'<label class="text-xs block mt-3">研究生路徑<select id="pgPath" class="w-full mt-1 p-2 border rounded"><option value="taught">授課型碩士</option><option value="phd">博士/研究型</option></select></label>';$('usExtras').innerHTML=h}
function sliderHtml(label,id,min,max,val){return `<div class="mt-3"><label class="text-xs font-bold">${label}<b id="${id}V" class="float-right">${val}</b></label><input id="${id}" type="range" min="${min}" max="${max}" step="1" value="${val}" class="w-full"></div>`}
setUp();
</script>
